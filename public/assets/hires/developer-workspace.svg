<text x="762" y="510">◇ package.json</text><text x="762" y="541">◇ README.md</text>
</g>
<!-- coding area -->
<g font-family="monospace" font-size="17">
<text x="955" y="187" fill="#67808c">01</text><text x="1014" y="187" fill="#c5a0e6">export</text><text x="1087" y="187" fill="#77c5c7"> function</text><text x="1170" y="187" fill="#f6dcab"> buildSystems</text><text x="1320" y="187" fill="#d3e0e9">() {</text>
<text x="955" y="223" fill="#67808c">02</text><text x="1035" y="223" fill="#89aab4">const</text><text x="1095" y="223" fill="#c5e4cf"> vision</text><text x="1172" y="223" fill="#d3e0e9"> = {</text>
<text x="955" y="259" fill="#67808c">03</text><text x="1068" y="259" fill="#e7c792">architecture:</text><text x="1216" y="259" fill="#9ad3b9">'scalable',</text>
<text x="955" y="295" fill="#67808c">04</text><text x="1068" y="295" fill="#e7c792">experience:</text><text x="1200" y="295" fill="#9ad3b9">'human',</text>
<text x="955" y="331" fill="#67808c">05</text><text x="1068" y="331" fill="#e7c792">quality:</text><text x="1160" y="331" fill="#9ad3b9">'verified',</text>
<text x="955" y="367" fill="#67808c">06</text><text x="1035" y="367" fill="#d3e0e9">};</text>
<text x="955" y="403" fill="#67808c">07</text><text x="1035" y="403" fill="#c5a0e6">return</text><text x="1115" y="403" fill="#77c5c7"> orchestrate</text><text x="1260" y="403" fill="#d3e0e9">(vision);</text>
<text x="955" y="439" fill="#67808c">08</text><text x="1014" y="439" fill="#d3e0e9">}</text>
</g>
