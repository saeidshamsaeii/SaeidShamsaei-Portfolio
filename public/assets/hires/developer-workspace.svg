<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustrated software engineering workspace with code editor and terminal">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d14"/><stop offset=".52" stop-color="#101b24"/><stop offset="1" stop-color="#07090e"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2d2520"/><stop offset=".8" stop-color="#0e0e12"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1e26"/><stop offset="1" stop-color="#070d13"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe0aa"/><stop offset="1" stop-color="#bd7f39"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#4bc5d1" stop-opacity=".26"/><stop offset="1" stop-color="#4bc5d1" stop-opacity="0"/></radialGradient>
 <radialGradient id="amber"><stop stop-color="#eeaf5a" stop-opacity=".24"/><stop offset="1" stop-color="#eeaf5a" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-40%" y="-50%" width="180%" height="200%"><feGaussianBlur stdDeviation="25"/></filter>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#91aab5" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)" opacity=".75"/>
